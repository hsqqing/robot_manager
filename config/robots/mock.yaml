# Local-only profile for Mock builds. It never connects to an EFORT controller.
schema_version: 1

service:
  instance_id: mock-robot-01
  state_poll_ms: 50
  state_stale_after_ms: 500
  command_queue_capacity: 16
  command_history_capacity: 4096

robot:
  id: mock-robot-01
  driver: mock
  address: mock://robot-01
  model: generic-mock
  axis_count: 6
  verify_sdk_version: true
  sdk_debug_logging: false

control_lease:
  ttl_ms: 3000
  jog_heartbeat_timeout_ms: 300

limits:
  motion_enabled: false
  program_execution_enabled: false
  maximum_joint_speed_percent: 20
  maximum_linear_speed_mm_per_second: 500

transport:
  grpc:
    listen: 127.0.0.1:50051
    allow_insecure_loopback: true
